[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cristuford-trainplat_jd257"
version = "0.1.0"
description = "从样本里推断大模型训练平台工程师·灰度发布与版本回滚应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cristuford" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cristuford.github.io"
Repository = "https://github.com/cristuford/trainplat_jd257"
Issues = "https://github.com/cristuford/trainplat_jd257/issues"

[project.scripts]
trainplat_jd257 = "trainplat_jd257:main"

[tool.setuptools]
py-modules = ["trainplat_jd257"]
